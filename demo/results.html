<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LossLens results</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #0f1420; color: #e8ecf5; font-size: 22px; }
  header { padding: 22px 32px 6px; }
  h1 { margin: 0; font-size: 46px; }
  .sub { color: #9fb0d0; font-size: 22px; margin-top: 6px; }
  nav { position: sticky; top: 0; z-index: 5; background: #0f1420; display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 28px; border-bottom: 1px solid #243357; }
  nav button, nav a { background: #1f2a44; color: #dbe4ff; border: 0; border-radius: 28px; padding: 12px 22px; font-size: 21px; cursor: pointer; text-decoration: none; }
  nav button.on { background: #5c7cfa; color: #fff; }
  nav a { background: #2b8a3e; color: #fff; }
  section { display: none; padding: 14px 28px 50px; }
  section.on { display: block; }
  h2 { margin: 8px 0 6px; font-size: 38px; }
  .what { color: #c5d0e8; font-size: 24px; line-height: 1.5; margin: 8px 0 16px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(560px, 100%), 1fr)); gap: 20px; align-items: start; }
  .box { background: #182033; border-radius: 16px; padding: 18px; margin: 0 0 20px; }
  .box h3 { margin: 0 0 8px; font-size: 26px; }
  .cards { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 20px; }
  .card { flex: 1; min-width: 200px; background: #1f2a44; border-radius: 14px; padding: 14px 16px; }
  .card b { display: block; font-size: 56px; line-height: 1.1; }
  .card span { font-size: 19px; color: #c5d0e8; }
  .line { font-size: 30px; font-weight: 700; background: #243357; border-radius: 14px; padding: 18px 22px; margin: 0 0 20px; line-height: 1.4; }
  table { border-collapse: collapse; width: 100%; font-size: 21px; }
  td, th { border-bottom: 1px solid #2a3550; padding: 10px 8px; text-align: left; vertical-align: top; }
  .ok { color: #5be38a; font-weight: 800; } .no { color: #ff8a8a; font-weight: 800; } .mid { color: #ffd166; font-weight: 800; }
  .flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 14px; margin-bottom: 14px; }
  .step { background: #243357; border-radius: 12px; padding: 16px 20px; font-size: 24px; flex: 1; min-width: 220px; }
  .arrow { font-size: 34px; color: #7f8fb0; align-self: center; }
  ul { line-height: 1.6; color: #c5d0e8; font-size: 22px; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<header>
  <h1>LossLens: results in plain words</h1>
  <div class="sub">Every number comes from our own experiments: many repeated runs, and every received file checked byte for byte.</div>
</header>
<nav id="nav"></nav>
<div id="app"></div>
<script>
async function main() {
  // Step 1: load the numbers made by analysis/build_results.py
  let data;
  try {
    data = await (await fetch("results.json?t=" + Date.now(), { cache: "no-store" })).json();
  } catch (e) {
    document.getElementById("app").innerHTML = '<div class="box">Could not load results.json. Run analysis/build_results.py first, and open this page through the demo server (serve.py).</div>';
    return;
  }

  // Step 2: names, colours and small helpers
  const colour = { reno: "#ff6b6b", cubic: "#51cf66", fixed: "#4dabf7", losslens: "#b388ff", llcut09: "#adb5bd", llecn: "#ffa94d", llfull: "#38d9a9" };
  const short = { reno: "Standard|(Reno)", cubic: "Standard|(CUBIC)", fixed: "Fixed|speed", losslens: "LossLens", llcut09: "Never slows|down", llecn: "Router|marks only", llfull: "Delay +|router marks" };
  const nm = (cc) => short[cc].replace("|", " ");
  const f1 = (x) => (x == null ? "n/a" : x.toFixed(1));
  const pc = (x) => (x == null ? "n/a" : Math.round(x * 100) + "%");
  const g = (k, cc, m) => (data.scen[k] && data.scen[k].ctrl[cc] ? data.scen[k].ctrl[cc][m] : null);
  const have = (k) => data.scen[k] && Object.keys(data.scen[k].ctrl).length > 0;
  const order5 = ["reno", "cubic", "fixed", "losslens", "llcut09"];
  const box = (title, inner) => `<div class="box"><h3>${title}</h3>${inner}</div>`;

  // Step 3: bar chart with whiskers (items: label with | as line break, v, lo, hi, color)
  const bars = (items, unit) => {
    const W = 900, H = 430, L = 66, B = 92, T = 40, R = 16;
    const ymax = Math.max(...items.map(i => (i.hi != null ? i.hi : i.v))) * 1.2 || 1;
    const Y = (v) => H - B - (H - B - T) * v / ymax;
    const bw = (W - L - R) / items.length;
    let s = `<svg viewBox="0 0 ${W} ${H}">`;
    for (let k = 0; k <= 4; k++) {
      const yy = Y(ymax * k / 4);
      s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#2a3550"/><text x="${L - 8}" y="${yy + 6}" fill="#9fb0d0" font-size="17" text-anchor="end">${(ymax * k / 4).toFixed(ymax < 10 ? 1 : 0)}</text>`;
    }
    items.forEach((it, i) => {
      const x = L + i * bw + bw * 0.14, w = bw * 0.72, cx = x + w / 2;
      const top = it.hi != null ? it.hi : it.v;
      s += `<rect x="${x}" y="${Y(it.v)}" width="${w}" height="${Math.max(0, H - B - Y(it.v))}" fill="${it.color}" rx="5"/>`;
      if (it.lo != null) {
        s += `<line x1="${cx}" x2="${cx}" y1="${Y(it.lo)}" y2="${Y(it.hi)}" stroke="#fff" stroke-width="2"/><line x1="${cx - 9}" x2="${cx + 9}" y1="${Y(it.hi)}" y2="${Y(it.hi)}" stroke="#fff" stroke-width="2"/><line x1="${cx - 9}" x2="${cx + 9}" y1="${Y(it.lo)}" y2="${Y(it.lo)}" stroke="#fff" stroke-width="2"/>`;
      }
      s += `<text x="${cx}" y="${Y(top) - 8}" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">${it.v.toFixed(1)}</text>`;
      it.label.split("|").forEach((p, j) => { s += `<text x="${cx}" y="${H - B + 24 + j * 22}" fill="#dbe4ff" font-size="18" text-anchor="middle">${p}</text>`; });
    });
    return s + `<text x="8" y="22" fill="#9fb0d0" font-size="18">${unit}</text></svg>`;
  };
  const bar5 = (key, metric, order) => {
    const items = order.filter(cc => g(key, cc, metric)).map(cc => ({ label: short[cc], v: g(key, cc, metric)[0], lo: g(key, cc, metric)[1], hi: g(key, cc, metric)[2], color: colour[cc] }));
    if (!items.length) return '<div class="what">No data for this test yet.</div>';
    return bars(items, metric === "goodput" ? "speed in Mbps (average of repeated runs, whiskers = 95% range)" : "extra waiting time in the queue, ms (average, whiskers = 95% range)");
  };
  const cards = (key, order) => {
    if (!data.scen[key] || !data.scen[key].labels_ok) return '<div class="what">Dropped-packet counts for this test are being re-run.</div>';
    return '<div class="cards">' + order.filter(cc => g(key, cc, "overflow") != null).map(cc => `<div class="card" style="border-top:6px solid ${colour[cc]}"><b>${Math.round(g(key, cc, "overflow"))}</b><span>${nm(cc)}: packets dropped because the queue was full (per run)</span></div>`).join("") + "</div>";
  };
  const rec = (k, order) => !data.scen[k].labels_ok ? '<div class="what">Accuracy numbers for this test are being re-run.</div>' :
    "<table><tr><th>Sender</th><th>Congestion drops recognised</th><th>Radio-glitch drops recognised</th></tr>" +
    order.filter(cc => g(k, cc, "cong_rec") != null || g(k, cc, "rand_rec") != null).map(cc => `<tr><td>${nm(cc)}</td><td>${pc(g(k, cc, "cong_rec"))}</td><td>${pc(g(k, cc, "rand_rec"))}</td></tr>`).join("") + "</table>";

  // Step 4: line charts (speed against the share of packets lost, and the capacity pattern)
  const lines = (labels, series) => {
    const W = 900, H = 470, L = 66, B = 112, T = 40, R = 20, ymax = 20;
    const X = (i) => L + (W - L - R) * i / (labels.length - 1);
    const Y = (v) => H - B - (H - B - T) * v / ymax;
    let s = `<svg viewBox="0 0 ${W} ${H}">`;
    for (let k = 0; k <= 4; k++) {
      const yy = Y(ymax * k / 4);
      s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#2a3550"/><text x="${L - 8}" y="${yy + 6}" fill="#9fb0d0" font-size="17" text-anchor="end">${(ymax * k / 4).toFixed(0)}</text>`;
    }
    labels.forEach((l, i) => { s += `<text x="${X(i)}" y="${H - B + 26}" fill="#dbe4ff" font-size="18" text-anchor="middle">${l}%</text>`; });
    s += `<text x="${(L + W - R) / 2}" y="${H - B + 54}" fill="#9fb0d0" font-size="18" text-anchor="middle">share of packets lost to radio glitches</text><text x="8" y="22" fill="#9fb0d0" font-size="18">speed (Mbps)</text>`;
    series.forEach((sr, k) => {
      const pts = sr.ys.map((v, i) => (v == null ? null : [X(i), Y(v)])).filter(p => p);
      s += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${sr.color}" stroke-width="4"${sr.dash ? ' stroke-dasharray="8 6"' : ""}/>`;
      if (!sr.dash) pts.forEach(p => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${sr.color}"/>`; });
      s += `<text x="${L + (k % 2) * 400}" y="${H - 34 + Math.floor(k / 2) * 26}" fill="${sr.color}" font-size="19" font-weight="600">${sr.name}</text>`;
    });
    return s + "</svg>";
  };
  const traceSvg = (arr) => {
    const W = 900, H = 270, L = 60, B = 56, T = 30, R = 14, ymax = Math.ceil(Math.max(...arr));
    const X = (i) => L + (W - L - R) * i / (arr.length - 1);
    const Y = (v) => H - B - (H - B - T) * v / ymax;
    let s = `<svg viewBox="0 0 ${W} ${H}">`;
    for (let k = 0; k <= 4; k++) {
      const yy = Y(ymax * k / 4);
      s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#2a3550"/><text x="${L - 8}" y="${yy + 6}" fill="#9fb0d0" font-size="17" text-anchor="end">${(ymax * k / 4).toFixed(0)}</text>`;
    }
    s += `<polyline points="${arr.map((v, i) => X(i) + "," + Y(v)).join(" ")}" fill="none" stroke="#4dabf7" stroke-width="2"/>`;
    s += `<text x="${(L + W - R) / 2}" y="${H - 14}" fill="#9fb0d0" font-size="18" text-anchor="middle">${(arr.length / 10).toFixed(0)} seconds of link capacity, replayed in a loop</text><text x="8" y="20" fill="#9fb0d0" font-size="18">capacity (Mbps)</text>`;
    return s + "</svg>";
  };

  // Step 5: the sections, in the order you would present them
  const secs = {};
  const i1 = data.s2.loss.indexOf(1);
  const r1 = i1 >= 0 ? data.s2.reno.mean[i1] : null;
  const Lf = g("fast1", "losslens", "goodput"), Cf = g("fast1", "cubic", "goodput"), Nf = g("fast1", "llcut09", "goodput");

  secs["The problem"] = `<h2>The problem</h2><div class="what">Wireless links (WiFi, mobile data) lose packets for two different reasons: the network is jammed, or the radio had a glitch. A standard sender cannot tell which, so it halves its speed at every lost packet.</div>` +
    (r1 == null ? "" : `<div class="line">At 1% radio loss a standard sender uses only ${(r1 / 20 * 100).toFixed(0)}% of a 20 Mbps link.</div>`) +
    `<div class="grid2">` +
    (r1 == null ? "" : box("One packet in 100 is lost to radio glitches", `<div style="font-size:24px">The link can carry: <b>20 Mbps</b></div><div style="background:#4dabf7;height:26px;border-radius:13px;width:100%;margin:8px 0 22px"></div><div style="font-size:24px">A standard sender (Reno) gets only: <b>${f1(r1)} Mbps</b></div><div style="background:#ff6b6b;height:26px;border-radius:13px;width:${Math.max(2, r1 / 20 * 100)}%;margin:8px 0"></div>`)) +
    (data.s2.loss.length > 1 ? box("Speed as more packets are lost", lines(data.s2.loss, [
      { name: "Standard (Reno)", color: colour.reno, ys: data.s2.reno.mean },
      { name: "Standard (CUBIC)", color: colour.cubic, ys: data.s2.cubic.mean },
      { name: "Fixed speed", color: colour.fixed, ys: data.s2.fixed.mean },
      { name: "Textbook formula", color: "#ffffff", dash: true, ys: data.s2.mathis }])) : "") +
    `</div><div class="what">Red and green: standard senders collapse as more packets are lost, and the red line follows the textbook formula (white dashes), which shows our code behaves correctly. Blue: a sender that never adapts stays near ${f1(data.s2.fixed.mean[0])} Mbps whatever the loss, but it can never use the whole link.</div>`;

  secs["How LossLens works"] = `<h2>How LossLens works</h2><div class="what">LossLens watches how long packets wait in the queue. On a jammed link that waiting time grows. On a link with radio glitches it does not.</div><div class="grid2">` +
    box("What happens when a packet is lost", `<div class="flow"><div class="step">A packet is lost</div><div class="arrow">&#8594;</div><div class="step">Is the waiting time in the queue growing?</div></div><div class="flow"><div class="step" style="background:#5a2a2a"><b>YES</b>: the network is jammed. Slow down by 30%.</div><div class="step" style="background:#1f4d3a"><b>NO</b>: it was a radio glitch. Slow down by only 10%.</div></div>`) +
    box("Why the waiting time tells the truth", `<div class="what" style="margin-top:0">A jammed link has a line of packets waiting, so the waiting time climbs. A radio glitch destroys one packet without any line forming, so the waiting time stays flat.</div><div class="what">Safety net: if three losses in a row are called radio glitches while the waiting time keeps climbing, the next loss gets the full slow-down. Two optional extras were also built: a router can mark busy packets (ECN), and LossLens can listen to those marks too.</div>`) + `</div>`;

  if (have("fast1")) {
    const qL = g("fast1", "losslens", "qdelay"), qN = g("fast1", "llcut09", "qdelay"), oL = g("fast1", "losslens", "overflow"), oN = g("fast1", "llcut09", "overflow");
    secs["WiFi with radio loss"] = `<h2>A WiFi-like link</h2><div class="what">A 20 Mbps link where 1 packet in 100 is lost to radio glitches. Each sender sent a 5 MB file, repeated ${g("fast1", "reno", "n") || ""} times with different random seeds.</div>` +
      (Lf && Cf ? `<div class="line">LossLens averaged ${f1(Lf[0])} Mbps: ${(Lf[0] / Cf[0]).toFixed(1)} times the speed of CUBIC (${f1(Cf[0])} Mbps).</div>` : "") +
      `<div class="grid2">${box("Speed (higher is better)", bar5("fast1", "goodput", order5))}${box("Extra waiting time in the queue (lower is better)", bar5("fast1", "qdelay", order5))}</div>` + cards("fast1", order5) +
      (Nf && qL && qN ? `<div class="what">The sender that never slows down is a little faster on its own (${f1(Nf[0])} Mbps), because ignoring congestion costs nothing when nobody else shares the link. The price is paid elsewhere: its packets wait ${f1(qN[0])} ms in the queue against ${f1(qL[0])} ms for LossLens` + (oL != null && oN != null && oL > 0 ? `, and it loses about ${Math.round(oN / oL)} times more packets.` : ".") + `</div>` : "");
  }

  if (have("cong1")) {
    const L = g("cong1", "losslens", "qdelay"), C = g("cong1", "cubic", "qdelay"), N = g("cong1", "llcut09", "qdelay");
    secs["Jammed link"] = `<h2>A jammed link</h2><div class="what">A 2 Mbps link with a small queue and no radio loss, so every loss is real congestion. All senders reach the same speed, so what matters is how long packets wait and how many are dropped.</div>` +
      (L && C && N ? `<div class="line">LossLens makes packets wait ${f1(L[0])} ms in the queue, about the same as CUBIC (${f1(C[0])} ms). The sender that never slows down makes them wait ${f1(N[0])} ms.</div>` : "") +
      `<div class="grid2">${box("Extra waiting time in the queue (lower is better)", bar5("cong1", "qdelay", order5))}${box("Packets dropped because the queue was full", cards("cong1", order5))}</div>`;
  }

  if (have("mix1") && have("mix1ecn")) {
    const o4 = ["losslens", "llecn", "llfull", "llcut09"];
    const e = g("mix1ecn", "losslens", "qdelay"), b = g("mix1ecn", "llecn", "qdelay");
    secs["Router marks (ECN)"] = `<h2>Router marks (ECN)</h2><div class="what">A router can set a flag on a packet when its queue builds up, instead of dropping it: a "getting busy" light. We tested LossLens using delay only, router marks only, or both. Same link in both tests: 2 Mbps, small queue, 1% radio loss.</div>` +
      (e && b ? `<div class="line">${(1 - b[0] / e[0]) > 0.2 ? "Router marks cut the queue waiting time from " + f1(e[0]) + " ms (delay only) to " + f1(b[0]) + " ms (marks only)." : "Router marks changed the queue waiting time little here: " + f1(e[0]) + " ms with delay only, " + f1(b[0]) + " ms with marks only."}</div>` : "") +
      `<div class="grid2">${box("Without router marks", bar5("mix1", "qdelay", o4))}${box("With router marks", bar5("mix1ecn", "qdelay", o4))}</div>` +
      `<div class="grid2">${box("Without marks: how often the true cause was recognised", rec("mix1", o4))}${box("With marks: how often the true cause was recognised", rec("mix1ecn", o4))}</div><div class="what">We know the true cause of every dropped packet because our emulator labels each drop. A drop counts as recognised when LossLens guessed that cause correctly.</div>`;
  }

  if (have("trace1") && data.trace.length > 1) {
    const L = g("trace1", "losslens", "goodput"), R = g("trace1", "reno", "goodput"), C = g("trace1", "cubic", "goodput");
    const uL = g("trace1", "losslens", "util"), uR = g("trace1", "reno", "util"), uC = g("trace1", "cubic", "util");
    secs["Changing WiFi"] = `<h2>A link whose speed keeps changing</h2><div class="what">Real WiFi speed changes constantly. This test replays a synthetic WiFi-like capacity pattern that changes every 0.1 second, with 1% radio loss as well. Each run starts the pattern from its beginning.</div>` +
      (L && R && C ? `<div class="line">LossLens averaged ${f1(L[0])} Mbps, Reno ${f1(R[0])} Mbps and CUBIC ${f1(C[0])} Mbps.` + (uL && uR && uC ? ` Of the capacity available during each run, LossLens used ${pc(uL[0])}, Reno ${pc(uR[0])} and CUBIC ${pc(uC[0])}.` : "") + `</div>` : "") +
      box("The link capacity pattern", traceSvg(data.trace)) +
      `<div class="grid2">${box("Speed (higher is better)", bar5("trace1", "goodput", order5))}${box("Extra waiting time in the queue (lower is better)", bar5("trace1", "qdelay", order5))}</div>` + cards("trace1", order5);
  }

  const rr = g("fast1", "losslens", "rand_rec"), cr = g("cong1", "losslens", "cong_rec");
  const lc = g("cong1", "losslens", "qdelay"), cc1 = g("cong1", "cubic", "qdelay");
  const tl = g("trace1", "losslens", "goodput"), tc = g("trace1", "cubic", "goodput");
  const e0 = g("mix1ecn", "losslens", "qdelay"), e1 = g("mix1ecn", "llecn", "qdelay");
  const qLf = g("fast1", "losslens", "qdelay"), qNf = g("fast1", "llcut09", "qdelay");
  const rows = [
    ["A standard sender (Reno) uses under 25% of the link at 1% radio loss", "ok", r1 == null ? "Supported" : `Supported: it uses about ${(r1 / 20 * 100).toFixed(0)}%`],
    ["Our Reno matches the textbook formula within a factor of 2", "ok", "Supported at every loss rate tested"],
    Lf && Cf ? ["LossLens is at least 1.5 times faster than CUBIC at 1% radio loss", Lf[0] / Cf[0] >= 1.5 ? "ok" : "no", `${(Lf[0] / Cf[0]).toFixed(1)} times on the WiFi-like test`] : null,
    lc && cc1 ? ["On a jammed link LossLens keeps queue waiting within 10% of CUBIC", lc[0] / cc1[0] <= 1.1 ? "ok" : "no", `${f1(lc[0])} ms against ${f1(cc1[0])} ms`] : null,
    tl && tc ? ["LossLens is at least 1.5 times faster than CUBIC on the changing WiFi link", tl[0] / tc[0] >= 1.5 ? "ok" : "no", `${(tl[0] / tc[0]).toFixed(1)} times`] : null,
    Lf && Nf ? ["LossLens is faster than a sender that never slows down", Lf[0] > Nf[0] ? "ok" : "no", `Not true: that control reaches ${f1(Nf[0])} Mbps against ${f1(Lf[0])}. LossLens` + (qLf && qNf ? ` keeps the queue about ${f1(qNf[0] - qLf[0])} ms shorter.` : " drops far fewer packets.")] : null,
    rr != null && cr != null ? ["Delay alone recognises radio glitches at least 85% of the time", "mid", `${pc(rr)} of radio-glitch drops recognised on the WiFi test, but only ${pc(cr)} of congestion drops on the jammed link`] : null,
    e0 && e1 ? ["Router marks shorten the queue", e1[0] < 0.8 * e0[0] ? "ok" : "mid", `${f1(e0[0])} ms with delay only, ${f1(e1[0])} ms with router marks only`] : null
  ].filter(Boolean);
  secs["Can you trust it?"] = `<h2>Can you trust it?</h2><div class="cards"><div class="card"><b>${data.runs_total}</b><span>experiment runs shown here</span></div><div class="card"><b>${data.runs_total ? Math.round(data.hash_ok / data.runs_total * 100) : 0}%</b><span>of runs delivered the file byte for byte identical</span></div><div class="card"><b>10</b><span>repeated runs per setting, each with a different random seed</span></div></div>
    <div class="what">We wrote every prediction down before running the test, tuned LossLens on separate seeds and then froze its settings, and we report the misses too.</div>
    <div class="box"><table><tr><th>Prediction</th><th></th><th>Outcome</th></tr>${rows.map(r => `<tr><td>${r[0]}</td><td class="${r[1]}">${r[1] === "ok" ? "HELD" : r[1] === "no" ? "MISSED" : "PARTLY"}</td><td>${r[2]}</td></tr>`).join("")}</table></div>
    <div class="box"><h3>Honest limits</h3><ul><li>Radio loss is created by software, not by a real radio. In the hardware demo the packets do cross a real network.</li><li>One sender at a time on one bottleneck link. Competing flows were not measured.</li><li>The changing-WiFi pattern is synthetic, and each run replays it from the start, so a run covers only its first seconds.</li><li>Reno and CUBIC are our own simplified versions, and a BBR-style sender was not built.</li><li>LossLens varies from run to run: some runs were much slower than others.</li><li>Delay alone misses some real congestion. Router marks were tested on one link with one threshold.</li><li>A mix-up in the first router-marks test was found and fixed, and the numbers shown come from the clean rerun.</li></ul></div>`;

  // Step 6: build the tabs and switch between them
  const nav = document.getElementById("nav"), app = document.getElementById("app");
  Object.keys(secs).forEach((name, i) => {
    const b = document.createElement("button");
    b.textContent = name;
    const s = document.createElement("section");
    s.innerHTML = secs[name];
    if (i === 0) { b.className = "on"; s.className = "on"; }
    b.onclick = () => {
      nav.querySelectorAll("button").forEach(x => { x.className = ""; });
      app.querySelectorAll("section").forEach(x => { x.className = ""; });
      b.className = "on";
      s.className = "on";
      window.scrollTo(0, 0);
    };
    nav.appendChild(b);
    app.appendChild(s);
  });
  const live = document.createElement("a");
  live.href = "dashboard.html";
  live.textContent = "Live demo";
  nav.appendChild(live);
}
main();
</script>
</body>
</html>
