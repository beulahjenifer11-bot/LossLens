<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LossLens live demo</title>
<style>
  body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #0f1420; color: #e8ecf5; }
  h1 { margin: 0; padding: 14px 18px 4px; font-size: 24px; }
  #banner { padding: 0 18px 8px; color: #9fb0d0; font-size: 16px; }
  .legend { padding: 0 18px 10px; color: #9fb0d0; font-size: 13px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; padding: 0 14px 14px; }
  .panel { background: #182033; border-radius: 14px; padding: 14px; }
  .head { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 600; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #2a3550; }
  .speed { font-size: 54px; font-weight: 700; line-height: 1.1; margin-top: 6px; }
  .speed small { font-size: 18px; font-weight: 400; color: #9fb0d0; }
  .bar { height: 12px; background: #2a3550; border-radius: 8px; margin: 8px 0; overflow: hidden; }
  .fill { height: 100%; width: 0%; }
  canvas { width: 100%; height: 170px; background: #121a2b; border-radius: 8px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; font-size: 14px; color: #c5d0e8; }
  .stats b { color: #fff; }
  .ticker { margin-top: 8px; font-size: 13px; line-height: 1.5; color: #c5d0e8; min-height: 100px; }
  #score { margin: 0 14px 18px; padding: 14px; background: #1f2a44; border-radius: 14px; font-size: 20px; line-height: 1.5; display: none; }
</style>
</head>
<body>
<h1>LossLens live demo</h1>
<div id="banner"></div>
<div class="legend">Chart line = how many packets the sender allows in flight (its speed limit). Orange stripe = packet lost to a random radio glitch. Cyan stripe = packet lost because the queue was full.</div>
<div id="grid"></div>
<div id="score"></div>
<script>
function main() {
  // Step 1: settings from the web address, for example dashboard.html?left=p1_reno&right=p1_losslens
  const params = new URLSearchParams(location.search);
  const FILE_BYTES = Number(params.get("mb") || 5) * 1048576;
  const sides = [
    { run: params.get("left") || "p1_reno", label: params.get("llabel") || "Standard sender (Reno)", colour: "#ff6b6b" },
    { run: params.get("right") || "p1_losslens", label: params.get("rlabel") || "LossLens", colour: "#b388ff" }
  ];
  document.getElementById("banner").textContent = params.get("title") || "Link: 20 Mbps, 40 ms round trip, 1% of packets lost at random (emulated)";

  // Step 2: build one panel per side
  const grid = document.getElementById("grid");
  sides.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "panel";
    div.innerHTML =
      '<div class="head"><span>' + s.label + '</span><span class="badge" id="badge' + i + '">WAITING</span></div>' +
      '<div class="speed" id="speed' + i + '">0.0 <small>Mbps now</small></div>' +
      '<div class="bar"><div class="fill" id="fill' + i + '" style="background:' + s.colour + '"></div></div>' +
      '<canvas id="cv' + i + '"></canvas>' +
      '<div class="stats">' +
      '<div>File sent: <b id="pct' + i + '">0%</b></div>' +
      '<div>Extra waiting in queue: <b id="qd' + i + '">0 ms</b></div>' +
      '<div>Packets lost: <b id="lost' + i + '">0</b></div>' +
      '<div>Radio glitch / queue full: <b id="split' + i + '">0 / 0</b></div>' +
      '<div style="grid-column: span 2">Loss-cause test right: <b id="acc' + i + '">no losses yet</b> <span id="note' + i + '" style="color:#7f8fb0"></span></div>' +
      '</div><div class="ticker" id="tick' + i + '"></div>';
    grid.appendChild(div);
    s.done = false;
  });

  // Step 3: helpers to download a log file and turn it into rows (a half-written last line is skipped)
  const getText = async (url) => {
    try {
      const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
      return r.ok ? await r.text() : "";
    } catch (e) { return ""; }
  };
  const parse = (text, cols) => text.split("\n").slice(1).map(l => l.trim().split(",")).filter(p => p.length === cols && p.every(x => x !== ""));
  const words = { RANDOM: "radio glitch", QUEUE_OVERFLOW: "queue full" };
  const verdictWords = { RANDOM: "radio glitch", CONGESTION: "queue full" };

  // Step 4: every 0.7 seconds, read the three log files of each run and redraw its panel
  let busy = false;
  const tick = async () => {
    if (busy) return;
    busy = true;
    for (let i = 0; i < sides.length; i++) {
      const s = sides[i];
      const base = "/results/demo/" + s.run + "/";
      const [cw, ls, dr] = await Promise.all([getText(base + "cwnd_log.csv"), getText(base + "sender_losses.csv"), getText(base + "emulator_drops.csv")]);
      const rows = parse(cw, 6).map(p => ({ t: Number(p[0]) / 1000, cwnd: Number(p[1]) / 1200, srtt: Number(p[4]), acked: Number(p[5]) }));
      if (rows.length === 0) continue;
      const truth = {};
      parse(dr, 3).forEach(p => { truth[p[0]] = p[2]; });
      const losses = parse(ls, 6).map(p => ({ pn: p[0], t: Number(p[1]) / 1000, verdict: p[3] }));
      const last = rows[rows.length - 1];

      // Step 4a: finished? average speed? speed over the last second?
      const fin = rows.find(r => r.acked >= FILE_BYTES);
      s.done = !!fin;
      if (fin) { s.tfin = fin.t; s.avg = FILE_BYTES * 8 / fin.t / 1e6; }
      let ref = rows[0];
      for (let k = rows.length - 1; k >= 0; k--) { if (rows[k].t <= last.t - 1.0) { ref = rows[k]; break; } }
      const speed = Math.max(0, (last.acked - ref.acked) * 8 / Math.max(0.05, last.t - ref.t) / 1e6);
      document.getElementById("speed" + i).innerHTML = s.done ? s.avg.toFixed(1) + ' <small>Mbps average</small>' : speed.toFixed(1) + ' <small>Mbps now</small>';
      document.getElementById("badge" + i).textContent = s.done ? "FINISHED in " + s.tfin.toFixed(1) + " s" : "RUNNING";
      const pct = Math.min(100, last.acked / FILE_BYTES * 100);
      document.getElementById("fill" + i).style.width = pct + "%";
      document.getElementById("pct" + i).textContent = pct.toFixed(0) + "%";

      // Step 4b: extra waiting time in the queue = latest smoothed round trip minus the smallest one seen
      const srtts = rows.filter(r => r.srtt > 0).map(r => r.srtt);
      const q = srtts.length > 0 ? Math.max(0, last.srtt - Math.min(...srtts)) : 0;
      document.getElementById("qd" + i).textContent = q.toFixed(0) + " ms";

      // Step 4c: ground truth counts from the emulator, and how often the loss-cause test was right
      const vals = Object.values(truth);
      const nRandom = vals.filter(v => v === "RANDOM").length;
      const nQueue = vals.filter(v => v === "QUEUE_OVERFLOW").length;
      s.lostTotal = nRandom + nQueue;
      document.getElementById("lost" + i).textContent = s.lostTotal;
      document.getElementById("split" + i).textContent = nRandom + " / " + nQueue;
      const joined = losses.filter(l => truth[l.pn]);
      const right = joined.filter(l => (truth[l.pn] === "RANDOM" && l.verdict === "RANDOM") || (truth[l.pn] === "QUEUE_OVERFLOW" && l.verdict === "CONGESTION"));
      document.getElementById("acc" + i).textContent = joined.length > 0 ? right.length + " of " + joined.length + " (" + Math.round(100 * right.length / joined.length) + "%)" : "no losses yet";
      const shadow = /reno|cubic|llcut09|fixed/.test(s.run);
      document.getElementById("note" + i).textContent = shadow ? "(shown for comparison, this sender does not use it)" : "";
      document.getElementById("tick" + i).innerHTML = joined.slice(-6).reverse().map(l => {
        const ok = (truth[l.pn] === "RANDOM" && l.verdict === "RANDOM") || (truth[l.pn] === "QUEUE_OVERFLOW" && l.verdict === "CONGESTION");
        return l.t.toFixed(2) + " s: truly <b>" + words[truth[l.pn]] + "</b>, test guessed " + verdictWords[l.verdict] + (ok ? ' <span style="color:#5be38a">&#10003;</span>' : ' <span style="color:#ff8a8a">&#10007;</span>');
      }).join("<br>");

      // Step 4d: draw the window chart, loss stripes first, then the line
      const cv = document.getElementById("cv" + i);
      const dpr = window.devicePixelRatio || 1;
      const W = cv.clientWidth, H = cv.clientHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      const g = cv.getContext("2d");
      g.scale(dpr, dpr);
      const tmax = Math.max(2, last.t);
      const ymax = rows.reduce((m, r) => Math.max(m, r.cwnd), 20) * 1.1;
      const X = (t) => 6 + (t / tmax) * (W - 12);
      const Y = (v) => H - 18 - (v / ymax) * (H - 30);
      g.globalAlpha = 0.45;
      g.lineWidth = 1.5;
      losses.forEach(l => {
        g.strokeStyle = truth[l.pn] === "RANDOM" ? "#ffa94d" : truth[l.pn] === "QUEUE_OVERFLOW" ? "#4dd0e1" : "#7f8fb0";
        g.beginPath(); g.moveTo(X(l.t), 4); g.lineTo(X(l.t), H - 18); g.stroke();
      });
      g.globalAlpha = 1;
      g.strokeStyle = s.colour;
      g.lineWidth = 2;
      g.beginPath();
      rows.forEach((r, k) => { if (k === 0) g.moveTo(X(r.t), Y(r.cwnd)); else g.lineTo(X(r.t), Y(r.cwnd)); });
      g.stroke();
      g.fillStyle = "#7f8fb0";
      g.font = "11px Segoe UI, Arial";
      g.fillText("packets allowed in flight (top = " + Math.round(ymax) + ")", 8, 14);
      g.fillText("time: " + tmax.toFixed(0) + " s", W - 70, H - 4);
    }

    // Step 4e: when both runs have finished, show the scoreboard
    if (sides.every(s => s.done)) {
      const sc = document.getElementById("score");
      sc.style.display = "block";
      const a = sides[0], b = sides[1];
      const faster = Math.max(a.avg, b.avg) / Math.min(a.avg, b.avg);
      sc.innerHTML = "<b>Scoreboard</b><br>" +
        a.label + ": " + a.tfin.toFixed(1) + " s for the file, " + a.avg.toFixed(1) + " Mbps average, " + a.lostTotal + " packets lost<br>" +
        b.label + ": " + b.tfin.toFixed(1) + " s for the file, " + b.avg.toFixed(1) + " Mbps average, " + b.lostTotal + " packets lost" +
        (faster > 1.2 ? "<br>Speed difference: " + faster.toFixed(1) + " times" : "");
    }
    busy = false;
  };
  tick();
  setInterval(tick, 700);
}
main();
</script>
</body>
</html>
